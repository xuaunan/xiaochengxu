server:
  port: 8080

spring:
  application:
    name: sunshine-travel
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sunshine_travel?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 2000ms
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 不要开启 StdOutImpl：每条 SQL 同步打印完整结果集，列表页会被日志 I/O 拖慢
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

jwt:
  secret: change-me-jwt-secret-for-your-own-setup
  expiration: 86400000

app:
  upload-dir: D:/xiaochengxu/sunshine-travel/uploads
  map:
    tencent-key: YOUR_TENCENT_MAP_KEY

knife4j:
  enable: true

logging:
  level:
    com.sunshine.travel: info
